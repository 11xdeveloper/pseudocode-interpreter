# Builds and tests the interpreter natively, under sanitizers and as
# WebAssembly, and tests the npm package on every supported Node.js.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.0

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: sanitizers
            flags: -DPSEUDOCODE_SANITIZE=ON
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build ${{ matrix.flags }}
      - run: cmake --build build -j4
      - run: ctest --test-dir build -j4 --output-on-failure

  wasm:
    name: WebAssembly and npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}
      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      # The WebAssembly build's program tests use a native build's runner.
      - name: Native build, for the test runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4 --target program_tests

      - name: Install Chromium for the browser tests
        working-directory: tests/package
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build and test
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm -DPSEUDOCODE_TEST_RUNNER="$PWD/build/tests/program_tests" -DPSEUDOCODE_PACKAGE_TESTS=ON
          cmake --build build-wasm -j4
          ctest --test-dir build-wasm -j4 --output-on-failure

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build-wasm/pseudocode-interpreter-*.tgz
          if-no-files-found: error

  node:
    name: npm package on Node.js ${{ matrix.node }}
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest the package supports (engines in its package.json), to the newest.
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Install the package, as a user would
        run: |
          mkdir "$RUNNER_TEMP/project"
          cp tests/package/node.test.mjs "$RUNNER_TEMP/project/"
          echo '{ "private": true, "type": "module" }' > "$RUNNER_TEMP/project/package.json"
          cd "$RUNNER_TEMP/project"
          npm install --no-audit --no-fund --engine-strict "$GITHUB_WORKSPACE"/pseudocode-interpreter-*.tgz
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: node --test node.test.mjs
